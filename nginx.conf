server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/oncall-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and the shell must always be re-checked, or a new release never arrives.
    location = /sw.js {
        include /etc/nginx/oncall-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/oncall-headers.inc;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else is the single-page app (deep links fall back to index.html).
    location / {
        include /etc/nginx/oncall-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
